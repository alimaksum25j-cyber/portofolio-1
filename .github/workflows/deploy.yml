
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'CODINGAN ALI MAKSUM PORTOFOLIO/package-lock.json'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm ci
        working-directory: ./CODINGAN ALI MAKSUM PORTOFOLIO

      - name: Build Portfolio
        run: npm run build
        working-directory: ./CODINGAN ALI MAKSUM PORTOFOLIO

      - name: Upload Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './CODINGAN ALI MAKSUM PORTOFOLIO/dist'

      - name: Deploy Website
        uses: actions/deploy-pages@v4
